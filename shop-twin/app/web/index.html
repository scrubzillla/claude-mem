<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Twin</title>
<link rel="icon" href="icons/icon-32.png">
<link rel="stylesheet" href="twin.css">
</head>
<body>
<div id="stage"><div id="labels"></div></div>
<div id="loading">Loading shop…</div>

<div id="ui">
  <header id="bar">
    <span id="shop" class="shop"></span>
    <nav id="cols" aria-label="Repair orders by status"></nav>
    <span class="sp"></span>
    <div class="menuwrap">
      <button type="button" id="viewBtn" aria-haspopup="true" aria-expanded="false">View ▾</button>
      <div id="viewMenu" class="menu" role="menu" hidden>
        <button type="button" role="menuitem" data-view="vAerial">Aerial</button>
        <button type="button" role="menuitem" data-view="vPlan">Floor plan</button>
        <button type="button" role="menuitem" data-view="vInside">Inside</button>
        <button type="button" role="menuitem" data-view="vStreet">Street</button>
        <hr>
        <button type="button" role="menuitemcheckbox" id="tWalls" aria-checked="false">Walls down</button>
        <button type="button" role="menuitemcheckbox" id="tRoof" aria-checked="false">Roof off</button>
        <hr data-demo hidden>
        <button type="button" role="menuitem" id="arrive" data-demo hidden>Advance shop day (demo)</button>
      </div>
    </div>
  </header>
  <div id="colPop" class="menu" hidden></div>
  <section id="card" aria-label="Repair order" hidden></section>
  <div id="hint" hidden></div>
</div>
<div id="toast" hidden></div>
<script type="module" src="twin.js"></script>
</body>
</html>
